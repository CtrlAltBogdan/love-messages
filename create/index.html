<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Створити листівку</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
  </head>
  <body>
    <div class="container create-page">
      <h1>Створення листівки</h1>
      <form id="createForm" class="create-form">
        <div class="form-group">
          <label for="recipientName">Ім'я отримувача:</label>
          <input
            type="text"
            id="recipientName"
            name="name"
            required
            maxlength="30"
            placeholder="Богдан Ш."
          />
        </div>

        <div class="form-group">
          <label for="greetingText">Текст привітання:</label>
          <textarea
            id="greetingText"
            name="text"
            required
            placeholder="умри"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="senderName">Ім'я відправника:</label>
          <input
            type="text"
            id="senderName"
            name="sender"
            maxlength="30"
            placeholder="Анонім"
          />
        </div>

        <div class="form-group radio-group">
          <p class="radio-label">Виберіть персонажа:</p>
          <div class="radio-options">
            <label class="radio-option">
              <input type="radio" name="theme" value="stanislava" required />
              <span class="radio-text">Станіслава</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="theme" value="yana" required />
              <span class="radio-text">Яна</span>
            </label>
          </div>
        </div>

        <button type="submit" class="submit-btn">Створити</button>
      </form>
    </div>
